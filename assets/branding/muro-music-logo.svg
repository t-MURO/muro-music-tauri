<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Muro Music</title>

  <defs>
    <radialGradient id="disc" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#2b2f31"/>
      <stop offset="42%" stop-color="#141819"/>
      <stop offset="100%" stop-color="#050607"/>
    </radialGradient>

    <radialGradient id="label" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#ff5561"/>
      <stop offset="55%" stop-color="#ef3340"/>
      <stop offset="100%" stop-color="#b81b27"/>
    </radialGradient>

    <linearGradient id="sheen" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="34%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="72%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="rim" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20"/>
    </linearGradient>

    <clipPath id="discClip">
      <circle cx="256" cy="256" r="244"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#disc)"/>

  <g clip-path="url(#discClip)" fill="none" stroke="#ffffff" stroke-opacity="0.055">
    <circle cx="256" cy="256" r="232" stroke-width="2"/>
    <circle cx="256" cy="256" r="222" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="213" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="205" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="197" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="188" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="180" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="172" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="164" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="156" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="147" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="138" stroke-width="1.6"/>
    <circle cx="256" cy="256" r="128" stroke-width="1.6"/>
  </g>

  <circle cx="256" cy="256" r="240" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="256" cy="256" r="209" fill="none" stroke="#ef3340" stroke-opacity="0.42" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="5"/>

  <circle cx="256" cy="256" r="244" fill="url(#sheen)" clip-path="url(#discClip)"/>

  <!-- Label carrying the play mark from the previous logo, so the brand keeps
       its through-line. The triangle is optically centred: a centroid-centred
       triangle reads as sitting too far left. -->
  <circle cx="256" cy="256" r="100" fill="url(#label)"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#000000" stroke-opacity="0.30" stroke-width="2"/>
  <path d="M 230 214 L 308 256 L 230 298 Z"
        fill="#0b0d0e" fill-opacity="0.92"
        stroke="#0b0d0e" stroke-opacity="0.92" stroke-width="13" stroke-linejoin="round"/>

  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
</svg>
